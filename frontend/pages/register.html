
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up | CraveSpot</title>
    <link rel="stylesheet" href="../css/style.css">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg,#fff8f3,#f6eee7);
            color: #292524;
        }

        .auth-card {
            width: 100%;
            max-width: 430px;
            padding: 30px;
            background: white;
            border: 1px solid #eee3dd;
            border-radius: 18px;
            box-shadow: 0 12px 35px #7c2d1812;
        }

        .brand {
            display: flex; align-items: center; justify-content: center; gap: 9px;
            margin-bottom: 16px;
            color: #e43b45;
            text-align: center;
            font-size: 27px;
            font-weight: 850;
            letter-spacing: -.6px;
            text-decoration: none;
        }

        h1, .subtitle { text-align: center; }
        h1 { margin-bottom: 8px; font-size: 26px; }

        .subtitle {
            color: #78716c;
            font-size: 14px;
            line-height: 1.5;
        }

        .field { margin: 16px 0; }

        .field label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 700;
        }

        .field input {
            display: block;
            width: 100%;
            padding: 12px;
            border: 1px solid #d6d3d1;
            border-radius: 8px;
            font-size: 15px;
        }

        .password-field { position: relative; }

        .password-field input { padding-right: 46px; }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            border: none;
            background: transparent;
            color: #78716c;
            cursor: pointer;
        }

        .password-toggle:hover { color: #e43b45; }

        .password-toggle svg {
            width: 21px;
            height: 21px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .strength-track {
            height: 5px;
            margin-top: 8px;
            background: #e7e5e4;
            border-radius: 9px;
            overflow: hidden;
        }

        .strength-fill {
            width: 0;
            height: 100%;
            background: #e7e5e4;
            transition: width .2s;
        }

        .strength-text {
            margin: 6px 0 0;
            color: #78716c;
            font-size: 12px;
            line-height: 1.5;
        }

        .primary {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 9px;
            background: #e43b45;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .primary:hover { background: #bf2637; }
        .primary:disabled { opacity: .65; cursor: not-allowed; }

        #message {
            min-height: 0;
            color: #b91c1c;
            font-size: 13px;
            line-height: 1.5;
        }

        .bottom {
            margin-top: 21px;
            text-align: center;
            font-size: 14px;
        }

        .auth-card a { color: #e43b45; }

        .demo-note {
            margin-top: 18px;
            padding: 12px;
            background: linear-gradient(135deg,#fff8f3,#f6eee7);
            font-size: 12px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .auth-card { padding: 22px; }
        }
    
    </style>
</head>

<body>
<main class="auth-card">
    <a class="brand" href="../index.html">CraveSpot</a>
    <h1>Create Your Account</h1>
    <p class="subtitle">Join CraveSpot and discover food you'll love.</p>
    <p id="message" role="status" aria-live="polite"></p>

    <form id="registerForm" novalidate>
        <div class="field">
            <label for="fullName">Full name</label>
            <input id="fullName" name="fullName" type="text"
                   autocomplete="name" maxlength="80"
                   placeholder="Enter your full name" required>
        </div>

        <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email"
                   autocomplete="email" placeholder="you@example.com" required>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <div class="password-field">
                <input id="password" name="password" type="password"
                       placeholder="Create a password (6+ characters)"
                       minlength="6" maxlength="64"
                       autocomplete="new-password"
                       aria-describedby="strengthText" required>
                <button type="button" class="password-toggle"
                        onclick="togglePassword('password', this)"
                        aria-label="Show password">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>

            <div class="strength-track">
                <div id="strengthFill" class="strength-fill"></div>
            </div>
            <p id="strengthText" class="strength-text">
                Use at least 6 characters. No special character is required.
            </p>
        </div>

        <div class="field">
            <label for="confirmPassword">Confirm password</label>
            <div class="password-field">
                <input id="confirmPassword" name="confirmPassword"
                       type="password" placeholder="Confirm your password"
                       minlength="6" maxlength="64"
                       autocomplete="new-password" required>
                <button type="button" class="password-toggle"
                        onclick="togglePassword('confirmPassword', this)"
                        aria-label="Show password">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>
        </div>

        <button type="submit" class="primary" id="registerButton">
            Create Account
        </button>
    </form>

    <p class="bottom">Already have an account? <a href="login.html">Login</a></p>

    <div class="demo-note">
        <strong>Demo mode:</strong> Accounts are saved in this browser only. Use test credentials, not a real password.
    </div>
</main>

<script>
"use strict";
const form=document.getElementById("registerForm"),nameInput=document.getElementById("fullName"),emailInput=document.getElementById("email"),passwordInput=document.getElementById("password"),confirmInput=document.getElementById("confirmPassword"),message=document.getElementById("message"),strengthFill=document.getElementById("strengthFill"),strengthText=document.getElementById("strengthText"),registerButton=document.getElementById("registerButton");
function isValidPassword(value){return value.length>=6;}
async function hashPassword(value){if(!window.crypto?.subtle)return value;const bytes=new TextEncoder().encode(value);const hash=await crypto.subtle.digest("SHA-256",bytes);return Array.from(new Uint8Array(hash)).map(x=>x.toString(16).padStart(2,"0")).join("");}
function eyeSvg(showing){return showing?`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.2A10 10 0 0 1 12 5c6.5 0 10 7 10 7a16 16 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7a10 10 0 0 0 4-.8"/></svg>`:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>`;}
function togglePassword(inputId,button){const input=document.getElementById(inputId),show=input.type==="password";input.type=show?"text":"password";button.setAttribute("aria-label",show?"Hide password":"Show password");button.innerHTML=eyeSvg(show);}
passwordInput.addEventListener("input",()=>{const v=passwordInput.value;const checks=[v.length>=6,v.length>=10,/[A-Z]/.test(v)&&/[0-9]/.test(v)];strengthFill.style.width=(checks.filter(Boolean).length/3*100)+"%";strengthFill.style.background=checks.every(Boolean)?"#16a34a":v.length>=6?"#d97706":"#e43b45";strengthText.textContent=!v?"Use at least 6 characters. No special character is required.":v.length<6?"Add "+(6-v.length)+" more character"+(6-v.length===1?"":"s")+".":checks.every(Boolean)?"Password strength: good.":"Password is acceptable; longer passwords are safer.";});
form.addEventListener("submit",async event=>{event.preventDefault();message.textContent="";message.style.color="#b91c1c";const name=nameInput.value.trim(),email=emailInput.value.trim().toLowerCase(),password=passwordInput.value,confirmation=confirmInput.value,emailPattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;if(!name){message.textContent="Please enter your name.";nameInput.focus();return;}if(!emailPattern.test(email)){message.textContent="Please enter a valid email address.";emailInput.focus();return;}if(!isValidPassword(password)){message.textContent="Password must be at least 6 characters.";passwordInput.focus();return;}if(password!==confirmation){message.textContent="The passwords do not match.";confirmInput.focus();return;}registerButton.disabled=true;registerButton.textContent="Creating account…";try{const accounts=JSON.parse(localStorage.getItem("CraveSpotAccounts")||"[]");if(!Array.isArray(accounts))throw new Error("Invalid account data");if(accounts.some(item=>item&&String(item.email||"").toLowerCase()===email)){message.textContent="This email already has an account. Please log in.";emailInput.focus();return;}const passwordHash=await hashPassword(password);accounts.push({name,email,passwordHash});localStorage.setItem("CraveSpotAccounts",JSON.stringify(accounts));localStorage.setItem("CraveSpotLoggedIn","true");localStorage.setItem("CraveSpotUser",name);sessionStorage.removeItem("CraveSpotLoggedIn");sessionStorage.removeItem("CraveSpotUser");message.style.color="#15803d";message.textContent="Account created. Welcome to CraveSpot!";setTimeout(()=>window.location.href="../index.html",500);}catch(error){message.textContent="Could not save the demo account. Open the site through localhost and try again.";}finally{registerButton.disabled=false;registerButton.textContent="Create Account";}});
</script>
</body>
</html>
