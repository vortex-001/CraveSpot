<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CraveSpot</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            color: #292524;
            background: linear-gradient(135deg,#fff8f3,#f6eee7);
        }

        .auth-card {
            width: 100%;
            max-width: 430px;
            padding: 32px;
            background: #fff;
            border: 1px solid #f0e5df;
            border-radius: 20px;
            box-shadow: 0 14px 40px rgba(60, 30, 15, .09);
        }

        .brand {
            display: inline-flex; align-items: center; gap: 9px;
            margin-bottom: 22px;
            color: #e43b45;
            font-size: 24px;
            font-weight: 850;
            text-decoration: none;
            letter-spacing: -.6px;
        }

        h1 { margin: 0 0 8px; font-size: 28px; }

        .subtitle {
            margin: 0 0 22px;
            color: #78716c;
            line-height: 1.5;
        }

        .field { margin-bottom: 17px; }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 700;
        }

        .field input {
            display: block;
            width: 100%;
            padding: 12px;
            border: 1px solid #d6d3d1;
            border-radius: 8px;
            font-size: 15px;
        }

        .field input:focus {
            outline: 2px solid #f3b7c5;
            border-color: #e43b45;
        }

        .password-field { position: relative; }

        .password-field input { padding-right: 74px; }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 9px;
            transform: translateY(-50%);
            border: 0;
            padding: 5px;
            color: #e43b45;
            background: transparent;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
        }

        .remember-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 2px 0 18px;
            font-size: 14px;
        }

        .remember-row input { accent-color: #e43b45; }

        .primary {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 9px;
            background: #e43b45;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .primary:hover { background: #bf2637; }

        .primary:disabled {
            opacity: .65;
            cursor: not-allowed;
        }

        #message {
            min-height: 20px;
            margin: 0 0 12px;
            color: #b91c1c;
            font-size: 13px;
            line-height: 1.5;
        }

        .bottom {
            margin-top: 21px;
            text-align: center;
            font-size: 14px;
        }

        .bottom a {
            color: #e43b45;
            font-weight: 700;
        }

        .demo-note {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            background: #fff3f1;
            font-size: 12px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .auth-card { padding: 23px; }
        }
    
    </style>
</head>

<body>
<main class="auth-card">
    <a class="brand" href="../index.html">CraveSpot</a>

    <h1>Welcome Back</h1>
    <p class="subtitle">
        Log in to continue discovering food you'll love.
    </p>

    <p id="message" role="status" aria-live="polite"></p>

    <form id="loginForm" novalidate>
        <div class="field">
            <label for="email">Email address</label>
            <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="you@example.com"
                required
            >
        </div>

        <div class="field">
            <label for="password">Password</label>

            <div class="password-field">
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Enter your password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    id="togglePassword"
                    aria-label="Show password"
                >Show</button>
            </div>
        </div>

        <div style="text-align:right;margin:-7px 0 12px"><button type="button" id="forgotPasswordBtn" style="border:0;background:none;color:#e43b45;text-decoration:underline;cursor:pointer">Forgot password?</button></div>

        <label class="remember-row">
            <input id="rememberMe" type="checkbox" checked>
            Remember me
        </label>

        <button type="submit" class="primary" id="loginButton">
            Login
        </button>
    </form>

    <section id="resetPasswordPanel" hidden style="margin-top:20px;padding:16px;background:#fff8f3;border:1px solid #f2ded5;border-radius:12px">
      <h2 style="font-size:18px;margin:0 0 12px">Reset your password</h2>
      <div class="field"><label for="resetEmail">Account email</label><input id="resetEmail" type="email" placeholder="you@example.com"></div>
      <div class="field"><label for="resetNewPassword">New password</label><input id="resetNewPassword" type="password" placeholder="At least 6 characters"></div>
      <div class="field"><label for="resetConfirmPassword">Confirm password</label><input id="resetConfirmPassword" type="password" placeholder="Re-enter new password"></div>
      <button type="button" class="primary" id="resetPasswordSubmit">Reset password</button>
      <button type="button" id="cancelReset" style="margin-top:8px;border:0;background:none;color:#777;cursor:pointer">Cancel</button>
      <p id="resetMessage" role="status" aria-live="polite"></p>
    </section>

    <p class="bottom">
        Don't have an account?
        <a href="register.html">Create an account</a>
    </p>

    <div class="demo-note">
        <strong>Demo mode:</strong> This sign-in is stored in this browser only. Use test credentials, not a real password.
    </div>
</main>

<script>
"use strict";
const form=document.getElementById("loginForm"),emailInput=document.getElementById("email"),passwordInput=document.getElementById("password"),message=document.getElementById("message"),loginButton=document.getElementById("loginButton"),togglePassword=document.getElementById("togglePassword");
togglePassword.addEventListener("click",()=>{const show=passwordInput.type==="password";passwordInput.type=show?"text":"password";togglePassword.textContent=show?"Hide":"Show";togglePassword.setAttribute("aria-label",show?"Hide password":"Show password");});
async function hashPassword(value){if(!window.crypto?.subtle) throw new Error("Secure browser context required");const bytes=new TextEncoder().encode(value);const hash=await crypto.subtle.digest("SHA-256",bytes);return Array.from(new Uint8Array(hash)).map(x=>x.toString(16).padStart(2,"0")).join("");}
const forgotBtn=document.getElementById("forgotPasswordBtn"),resetPanel=document.getElementById("resetPasswordPanel"),resetMessage=document.getElementById("resetMessage");
forgotBtn.addEventListener("click",()=>{resetPanel.hidden=!resetPanel.hidden;document.getElementById("resetEmail").value=emailInput.value.trim();resetMessage.textContent="For this frontend demo, reset is saved locally in this browser.";});
document.getElementById("cancelReset").addEventListener("click",()=>resetPanel.hidden=true);
document.getElementById("resetPasswordSubmit").addEventListener("click",async()=>{const email=document.getElementById("resetEmail").value.trim().toLowerCase(),p1=document.getElementById("resetNewPassword").value,p2=document.getElementById("resetConfirmPassword").value;resetMessage.style.color="#b91c1c";if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){resetMessage.textContent="Enter a valid account email.";return;}if(p1.length<6){resetMessage.textContent="Password must be at least 6 characters.";return;}if(p1!==p2){resetMessage.textContent="Passwords do not match.";return;}try{const accounts=JSON.parse(localStorage.getItem("CraveSpotAccounts")||"[]"),account=accounts.find(a=>String(a.email||"").toLowerCase()===email);if(!account){resetMessage.textContent="No local account found for this email. Please sign up first.";return;}account.passwordHash=await hashPassword(p1);delete account.password;localStorage.setItem("CraveSpotAccounts",JSON.stringify(accounts));resetMessage.style.color="#15803d";resetMessage.textContent="Password updated. You can now log in.";passwordInput.value=p1;}catch{resetMessage.textContent="Unable to reset in this browser context. Open the site using localhost.";}});
form.addEventListener("submit",async event=>{event.preventDefault();message.textContent="";message.style.color="#b91c1c";const email=emailInput.value.trim().toLowerCase(),password=passwordInput.value;const emailPattern=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;if(!emailPattern.test(email)){message.textContent="Please enter a valid email address.";emailInput.focus();return;}if(!password){message.textContent="Please enter your password.";passwordInput.focus();return;}loginButton.disabled=true;loginButton.textContent="Checking…";try{const accounts=JSON.parse(localStorage.getItem("CraveSpotAccounts")||"[]");if(!Array.isArray(accounts))throw new Error("Invalid account data");const hashed=await hashPassword(password);const account=accounts.find(item=>item&&String(item.email||"").toLowerCase()===email&&(item.passwordHash===hashed||item.password===password));if(!account){message.textContent="Invalid email or password. If you are new, create an account first.";passwordInput.focus();return;}if(account.password){account.passwordHash=hashed;delete account.password;localStorage.setItem("CraveSpotAccounts",JSON.stringify(accounts));}const remember=document.getElementById("rememberMe").checked;const store=remember?localStorage:sessionStorage;const other=remember?sessionStorage:localStorage;store.setItem("CraveSpotLoggedIn","true");store.setItem("CraveSpotUser",account.name||email);other.removeItem("CraveSpotLoggedIn");other.removeItem("CraveSpotUser");message.style.color="#15803d";message.textContent="Login successful. Welcome back!";setTimeout(()=>window.location.href="../index.html",500);}catch(error){message.textContent="For this demo, open the site through localhost so browser security features are available.";}finally{loginButton.disabled=false;loginButton.textContent="Login";}});
</script>
</body>
</html>
