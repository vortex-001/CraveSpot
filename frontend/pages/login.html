<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CraveSpot</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            color: #292524;
            background: linear-gradient(135deg,#fff8f3,#f6eee7);
        }

        .auth-card {
            width: 100%;
            max-width: 430px;
            padding: 32px;
            background: #fff;
            border: 1px solid #f0e5df;
            border-radius: 20px;
            box-shadow: 0 14px 40px rgba(60, 30, 15, .09);
        }

        .brand {
            display: inline-flex; align-items: center; gap: 9px;
            margin-bottom: 22px;
            color: #e43b45;
            font-size: 24px;
            font-weight: 850;
            text-decoration: none;
            letter-spacing: -.6px;
        }

        h1 { margin: 0 0 8px; font-size: 28px; }

        .subtitle {
            margin: 0 0 22px;
            color: #78716c;
            line-height: 1.5;
        }

        .field { margin-bottom: 17px; }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: 700;
        }

        .field input {
            display: block;
            width: 100%;
            padding: 12px;
            border: 1px solid #d6d3d1;
            border-radius: 8px;
            font-size: 15px;
        }

        .field input:focus {
            outline: 2px solid #f3b7c5;
            border-color: #e43b45;
        }

        .password-field { position: relative; }

        .password-field input { padding-right: 74px; }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 9px;
            transform: translateY(-50%);
            border: 0;
            padding: 5px;
            color: #e43b45;
            background: transparent;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
        }

        .remember-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 2px 0 18px;
            font-size: 14px;
        }

        .remember-row input { accent-color: #e43b45; }

        .primary {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 9px;
            background: #e43b45;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .primary:hover { background: #bf2637; }

        .primary:disabled {
            opacity: .65;
            cursor: not-allowed;
        }

        #message {
            min-height: 20px;
            margin: 0 0 12px;
            color: #b91c1c;
            font-size: 13px;
            line-height: 1.5;
        }

        .bottom {
            margin-top: 21px;
            text-align: center;
            font-size: 14px;
        }

        .bottom a {
            color: #e43b45;
            font-weight: 700;
        }

        .demo-note {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            background: #fff3f1;
            font-size: 12px;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .auth-card { padding: 23px; }
        }
    
    </style>
    <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
</head>

<body>
<main class="auth-card">
    <a class="brand" href="../index.html">CraveSpot</a>

    <h1>Welcome Back</h1>
    <p class="subtitle">
        Log in to continue discovering food you'll love.
    </p>

    <p id="message" role="status" aria-live="polite"></p>

    <form id="loginForm" novalidate>
        <div class="field">
            <label for="email">Email address</label>
            <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="you@example.com"
                required
            >
        </div>

        <div class="field">
            <label for="password">Password</label>

            <div class="password-field">
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Enter your password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    id="togglePassword"
                    aria-label="Show password"
                >Show</button>
            </div>
        </div>

        <div style="text-align:right;margin:-7px 0 12px"><button type="button" id="forgotPasswordBtn" style="border:0;background:none;color:#e43b45;text-decoration:underline;cursor:pointer">Forgot password?</button></div>

        <label class="remember-row">
            <input id="rememberMe" type="checkbox" checked>
            Remember me
        </label>

        <button type="submit" class="primary" id="loginButton">
            Login
        </button>
    </form>

    <section id="resetPasswordPanel" hidden style="margin-top:20px;padding:16px;background:#fff8f3;border:1px solid #f2ded5;border-radius:12px">
      <h2 style="font-size:18px;margin:0 0 12px">Reset your password</h2>
      <div class="field"><label for="resetEmail">Account email</label><input id="resetEmail" type="email" placeholder="you@example.com"></div>
      <div class="field"><label for="resetNewPassword">New password</label><input id="resetNewPassword" type="password" placeholder="At least 6 characters"></div>
      <div class="field"><label for="resetConfirmPassword">Confirm password</label><input id="resetConfirmPassword" type="password" placeholder="Re-enter new password"></div>
      <button type="button" class="primary" id="resetPasswordSubmit">Reset password</button>
      <button type="button" id="cancelReset" style="margin-top:8px;border:0;background:none;color:#777;cursor:pointer">Cancel</button>
      <p id="resetMessage" role="status" aria-live="polite"></p>
    </section>

    <p class="bottom">
        Don't have an account?
        <a href="register.html">Create an account</a>
    </p>
</main>

<script src="../js/api.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
