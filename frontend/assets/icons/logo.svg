<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Circular Red Plate -->
  <defs>
    <linearGradient id="plateGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="100%" stop-color="#E23744"/>
    </linearGradient>
    <filter id="plateShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Plate Body -->
  <circle cx="50" cy="50" r="47" fill="url(#plateGradient)" filter="url(#plateShadow)"/>
  <!-- Rim Ring Detail -->
  <circle cx="50" cy="50" r="41" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.38"/>
  <!-- Inner Well -->
  <circle cx="50" cy="50" r="33.5" fill="#D32735"/>
  <circle cx="50" cy="50" r="33.5" fill="none" stroke="#000000" stroke-width="1.5" stroke-opacity="0.12"/>

  <!-- Fork on Left (Crisp White, 4 sleek prongs, smooth continuous geometry) -->
  <path d="M 31.5 23.5 C 32 23.5 32.5 24 32.5 24.8 L 32.5 34.5 C 32.5 35.8 34.5 35.8 34.5 34.5 L 34.5 24.8 C 34.5 24 35 23.5 35.5 23.5 C 36 23.5 36.5 24 36.5 24.8 L 36.5 34.5 C 36.5 35.8 38.5 35.8 38.5 34.5 L 38.5 24.8 C 38.5 24 39 23.5 39.5 23.5 C 40 23.5 40.5 24 40.5 24.8 L 40.5 34.5 C 40.5 35.8 42.5 35.8 42.5 34.5 L 42.5 24.8 C 42.5 24 43 23.5 43.5 23.5 C 44 23.5 44.5 24 44.5 24.8 L 44.5 35.5 C 44.5 39.8 41 42.8 39 44 L 39 72 C 39 74.2 35.5 74.2 35.5 72 L 35.5 44 C 33.5 42.8 30 39.8 30 35.5 L 30 24.8 C 30 24 30.5 23.5 31.5 23.5 Z" fill="#FFFFFF"/>

  <!-- Knife on Right (Crisp White, graceful curved blade, matching handle) -->
  <path d="M 61 24.5 C 61 24 61.5 23.5 62.5 23.5 C 65 24.5 68 28 68 36 C 68 41.5 65.5 43.8 63 44.2 L 63 72 C 63 74.2 59.5 74.2 59.5 72 L 59.5 24.5 C 59.5 24 60 23.5 61 24.5 Z" fill="#FFFFFF"/>
</svg>
