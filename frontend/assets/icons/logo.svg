<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Circular Red Plate -->
  <defs>
    <linearGradient id="plateGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="100%" stop-color="#E23744"/>
    </linearGradient>
    <filter id="plateShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Plate Body -->
  <circle cx="50" cy="50" r="47" fill="url(#plateGradient)" filter="url(#plateShadow)"/>
  <!-- Rim Ring Detail -->
  <circle cx="50" cy="50" r="41" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.38"/>
  <!-- Inner Well -->
  <circle cx="50" cy="50" r="33.5" fill="#D32735"/>
  <circle cx="50" cy="50" r="33.5" fill="none" stroke="#000000" stroke-width="1.5" stroke-opacity="0.12"/>

  <!-- Fork on Left (Crisp White) -->
  <g fill="#FFFFFF">
    <!-- Prongs -->
    <path d="M 33 24 L 35 24 L 35 34 C 35 36 36 37.5 37.5 38 L 37.5 73 C 37.5 74.4 38.6 75.5 40 75.5 C 41.4 75.5 42.5 74.4 42.5 73 L 42.5 38 C 44 37.5 45 36 45 34 L 45 24 L 47 24 L 47 34 C 47 38.5 44 41 41.5 41.8 L 41.5 73 C 41.5 74.9 39.9 76.5 38 76.5 C 36.1 76.5 34.5 74.9 34.5 73 L 34.5 41.8 C 32 41 29 38.5 29 34 L 29 24 L 31 24 L 31 34 C 31 36 32 37.5 33 38 Z"/>
    <!-- Center Prongs Slots -->
    <rect x="36" y="24" width="2" height="10" rx="1" fill="#D32735"/>
    <rect x="42" y="24" width="2" height="10" rx="1" fill="#D32735"/>
  </g>

  <!-- Knife on Right (Crisp White) -->
  <g fill="#FFFFFF">
    <!-- Curved Blade and Handle -->
    <path d="M 60 23.5 C 60 23.5 68 28 68 39 C 68 46 64 49.5 60.5 50.5 L 60.5 73 C 60.5 74.9 58.9 76.5 57 76.5 C 55.1 76.5 53.5 74.9 53.5 73 L 53.5 24 C 53.5 23.7 53.7 23.5 54 23.5 L 60 23.5 Z"/>
  </g>
</svg>
